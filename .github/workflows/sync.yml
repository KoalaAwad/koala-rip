name: Sync game data

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}    # "Run workflow" button in the Actions tab

permissions:
  contents: write
  issues: write # to open/close the "token expired" reminder issues

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Sync Steam
        id: steam
        continue-on-error: true
        run: node scripts/sync-steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Sync PlayStation
        id: psn
        continue-on-error: true
        run: node scripts/sync-psn.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}

      - name: Screenshots for newly ranked games
        continue-on-error: true
        run: node scripts/fetch-screens.mjs

      - name: Commit new data
        run: |
          # Skip the commit (and the redeploy) when the only change is the lastSynced timestamp.
          if git diff -U0 -- data | grep -E '^[+-][^+-]' | grep -vq '"lastSynced"'; then
            git config user.name "koala-rip sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Sync game data"
            git push
          else
            echo "No new data."
          fi

      # Instead of failing (and emailing) every 6 hours, keep one open issue per broken source.
      # It is opened the first time a sync fails and closed automatically once that sync works again.
      - name: Reminder issues
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STEAM_OUTCOME: ${{ steps.steam.outcome }}
          PSN_OUTCOME: ${{ steps.psn.outcome }}
        run: |
          remind() {
            local outcome="$1" title="$2" body="$3"
            local open
            open=$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
            if [ "$outcome" = "failure" ]; then
              [ -z "$open" ] && gh issue create --title "$title" --body "$body"
              echo "::warning::$title"
            elif [ -n "$open" ]; then
              gh issue close "$open" --comment "Sync is working again, closing."
            fi
          }
          remind "$PSN_OUTCOME" "PlayStation token expired" "The PlayStation sync can't log in, so PSN data on the site is frozen at the last good sync (Steam keeps updating).

          To fix:
          1. Sign in at https://www.playstation.com
          2. Open https://ca.account.sony.com/api/v1/ssocookie in the same browser and copy the npsso value
          3. Update the PSN_NPSSO secret: https://github.com/${{ github.repository }}/settings/secrets/actions

          This issue closes itself after the next successful sync (or run the workflow from the Actions tab)."
          remind "$STEAM_OUTCOME" "Steam sync failing" "The Steam sync failed. Check the STEAM_API_KEY secret at https://github.com/${{ github.repository }}/settings/secrets/actions (keys are managed at https://steamcommunity.com/dev/apikey).

          This issue closes itself after the next successful sync."
